spring.application.name=tesouraria
spring.config.import=optional:file:Back_End.env,optional:file:.env
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.jpa.show-sql: false
server.servlet.context-path=/
server.error.include-exception=false
server.error.include-stacktrace=never
# Logs em arquivo (além do console), com rotação automática. Relativo à
# pasta de onde o app inicia (Bese_Projeto/logs/ quando rodado de lá).
logging.file.name=logs/tesouraria.log
# Atrás de proxy reverso (nginx): resolve getRemoteAddr() via X-Forwarded-For.
# Sem isso, rate-limit (Bucket4j) e logs de auditoria enxergam sempre o IP do
# proxy (um balde só para todos + DoS com 5 logins errados). Conexão direta
# (sem header) continua funcionando. O Tomcat só confia no XFF quando quem
# conecta é proxy interno (loopback/redes privadas, padrão); se o proxy
# estiver fora dessas faixas, ajuste server.tomcat.remoteip.internal-proxies.
server.forward-headers-strategy=native
spring.messages.basename=messages

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=200
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size

# Configurações do Bucket4j (Rate Limiting)
# IMPORTANTE: 'url' é expressão regular (regex) casada contra o request URI.
# Os endpoints reais são maiúsculos (/API/...), então o regex precisa acompanhar.
bucket4j.enabled=true

# Regra 1: Proteção de Login (POST /API/User/login) - Máximo 5 requisições por minuto por IP
bucket4j.filters[0].cache-name=buckets
bucket4j.filters[0].filter-method=servlet
bucket4j.filters[0].url=^/API/User/login.*
bucket4j.filters[0].strategy=first
bucket4j.filters[0].http-response-body={ "status": 429, "error": "Too Many Requests", "message": "Muitas tentativas de login. Por favor, aguarde 1 minuto." }
bucket4j.filters[0].rate-limits[0].cache-key=getRemoteAddr()
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=5
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes

# Regra 2: Proteção Geral da API (/API/*) - Máximo 100 requisições por minuto por IP
bucket4j.filters[1].cache-name=buckets
bucket4j.filters[1].filter-method=servlet
bucket4j.filters[1].url=^/API/.*
bucket4j.filters[1].strategy=first
bucket4j.filters[1].http-response-body={ "status": 429, "error": "Too Many Requests", "message": "Limite de requisicoes excedido. Tente novamente mais tarde." }
bucket4j.filters[1].rate-limits[0].cache-key=getRemoteAddr()
bucket4j.filters[1].rate-limits[0].bandwidths[0].capacity=100
bucket4j.filters[1].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[1].rate-limits[0].bandwidths[0].unit=minutes
